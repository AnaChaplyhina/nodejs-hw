<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
      }
      .container {
        padding: 20px;
      }
      .btn {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Скидання паролю</h1>
      <p>Привіт, {{name}}!</p>
      <p>
        Ви отримали цей лист, тому що надійшов запит на скидання паролю для
        вашого акаунту.
      </p>
      <p>Щоб скинути пароль, натисніть на кнопку нижче:</p>
      <p>
        <a href="{{resetLink}}" class="btn">Скинути пароль</a>
      </p>
      <p>Посилання дійсне протягом 15 хвилин.</p>
      <p>Якщо ви не робили цей запит, проігноруйте цей лист.</p>
    </div>
  </body>
</html>
